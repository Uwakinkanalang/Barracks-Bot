name: Barracks Social Systems Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/marriage-system]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check changed social-system JavaScript syntax
        run: |
          files=(
            src/commands/Friendship/friendship.js
            src/commands/Marriage/marriage.js
            src/events/interactionCreate.js
            src/events/messageCreate.js
            src/events/voiceStateUpdate.js
            src/services/friendshipPanelService.js
            src/services/friendshipService.js
            src/services/marriagePanelService.js
            src/services/marriageService.js
            src/commands/Economy/daily.js
            src/app.js
            src/web/dashboard.js
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done
      - name: Run Friendship and Soulmate service tests
        run: node --test tests/socialSystems.test.js
