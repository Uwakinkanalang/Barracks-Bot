name: Deploy Barracks Bot website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        run: |
          mkdir -p site/dashboard
          cp index.html site/index.html
          cp -R dashboard/. site/dashboard/
          for route in leveling roles-channels tickets; do mkdir -p "site/dashboard/$route"; cp dashboard/index.html "site/dashboard/$route/index.html"; done
          # Publish the dashboard shell at every client-side route so refreshes work on GitHub Pages.
          for route in welcome goodbye ban boost message-builder moderation settings logs economy games-activities; do
            mkdir -p "site/dashboard/$route"
            cp dashboard/index.html "site/dashboard/$route/index.html"
          done
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
