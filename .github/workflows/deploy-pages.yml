name: Deploy Barracks Bot website
# Fresh-run deployment trigger after a failed-run artifact was duplicated.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare website files
        run: |
          mkdir -p site/dashboard
          cp index.html site/index.html
          cp -R dashboard/. site/dashboard/
          # Publish the dashboard shell at every dedicated sidebar URL so direct visits and F5 refreshes load the correct panel.
          for route in welcome goodbye ban boost message-builder moderation autonick settings logs economy games-activities leveling roles-channels boosters tickets clans clans/list prefix-commands slash-commands; do
            mkdir -p "site/dashboard/$route"
            cp dashboard/index.html "site/dashboard/$route/index.html"
          done
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
